services:
  server-nest:
    build: .
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
    depends_on:
      - redis
    mem_limit: 512m
    cpus: 0.75

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    mem_limit: 128m
    cpus: 0.125

volumes:
  redis-data:
