name: CI

on:
  push:
    branches: [main]
    paths: ['server-nest/**']
  pull_request:
    branches: [main]
    paths: ['server-nest/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-nest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: server-nest/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint --if-present
      - run: pnpm run build
      - run: pnpm run test --if-present
